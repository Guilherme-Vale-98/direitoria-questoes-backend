spring.application.name=questoes

# Managed hosts (Render, Fly, Cloud Run) inject the port to listen on. Locally
# there is no PORT and 8080 applies, so dev behaviour is unchanged.
server.port=${PORT:8080}

# Datasource for real runs / dev. Tests override this via Testcontainers @ServiceConnection.
# DB_URL still wins if set. Otherwise the URL is composed from parts, because a
# managed Postgres exposes host/port/database separately and its connection string
# is `postgres://…`, which JDBC cannot consume. Defaults reproduce the old local URL.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:direitoria-questoes}}
# Managed Postgres generates its own role name, so this cannot stay hardcoded.
spring.datasource.username=${DB_USERNAME:postgres}
# Real password comes from env DB_PASSWORD or application-local.properties (gitignored). Never commit it.
spring.datasource.password=${DB_PASSWORD:}

# Drizzle owns the schema: Hibernate only validates, never emits DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Auth / JWT. Secret MUST come from env JWT_SECRET or application-local.properties (gitignored).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=direitoria
app.jwt.audience=direitoria-app
app.jwt.access-ttl-seconds=900
app.refresh.ttl-days=14

# Pull in the gitignored local overrides (dev secret + DB password) if present.
spring.config.import=optional:application-local.properties
