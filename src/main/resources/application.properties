spring.application.name=questoes

# Managed hosts (Render, Fly, Cloud Run) inject the port to listen on. Locally
# there is no PORT and 8080 applies, so dev behaviour is unchanged.
server.port=${PORT:8080}

# Datasource for real runs / dev. Tests override this via Testcontainers @ServiceConnection.
# DB_URL still wins if set. Otherwise the URL is composed from parts, because a
# managed Postgres exposes host/port/database separately and its connection string
# is `postgres://…`, which JDBC cannot consume. Defaults reproduce the old local URL.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:direitoria-questoes}}
# Managed Postgres generates its own role name, so this cannot stay hardcoded.
spring.datasource.username=${DB_USERNAME:postgres}
# Real password comes from env DB_PASSWORD or application-local.properties (gitignored). Never commit it.
spring.datasource.password=${DB_PASSWORD:}

# --- Connection pool -------------------------------------------------------
# Unset, HikariCP runs a FIXED pool of 10 connections PER INSTANCE. Render keeps
# the old instance serving while the new one boots, so a deploy needs 10 + 10
# against a managed database with ~16 non-superuser slots. The new instance then
# dies in HikariPool.checkFailFast before Hibernate can read JDBC metadata:
#   FATAL: remaining connection slots are reserved for roles with the SUPERUSER
# That is why the failure appears on every push and never in local dev.
#
# Sized against the database instance's core count, NOT request volume: Postgres
# forks a process per connection, so more concurrent connections than the server
# has cores makes every query slower rather than the app faster. A connection is
# held only while a query actually runs, so 5 still serves far more requests per
# second than it has slots.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Below maximum-pool-size (Hikari's own default is a fixed pool) so an idle app
# stops squatting on slots that migrations, psql and monitoring also need. This
# is what keeps deploy overlap cheap: an idle old instance holds 2, not 10.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
# POST /questions/{id}/answer holds TWO connections at once: AttemptService
# .record() runs REQUIRES_NEW inside answer() (docs/adr/0003), and Spring keeps
# the suspended outer transaction's connection checked out. Concurrent answers
# can therefore starve the pool, so fail in 5s instead of blocking a request
# thread for Hikari's 30s default.
spring.datasource.hikari.connection-timeout=5000
# Recycle before the managed Postgres or its connection proxy drops a long-idle
# connection underneath us.
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000

# Drizzle owns the schema: Hibernate only validates, never emits DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Auth / JWT. Secret MUST come from env JWT_SECRET or application-local.properties (gitignored).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=direitoria
app.jwt.audience=direitoria-app
app.jwt.access-ttl-seconds=900
app.refresh.ttl-days=14

# Pull in the gitignored local overrides (dev secret + DB password) if present.
spring.config.import=optional:application-local.properties
