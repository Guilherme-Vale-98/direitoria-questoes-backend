spring.application.name=questoes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Non-secret, test-only values (real secret lives in application-local.properties, gitignored).
app.jwt.secret=test-only-secret-key-at-least-32-bytes-long-0123456789
app.jwt.issuer=direitoria
app.jwt.audience=direitoria-app
app.jwt.access-ttl-seconds=900
app.refresh.ttl-days=14

# Admin uploads — mirrors src/main/resources/application.properties, which this file shadows.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.max-swallow-size=31MB
